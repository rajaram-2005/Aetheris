[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aetheris"
version = "0.1.0"
description = "Aetheris — a next-generation AI thought partner for deep reasoning, creative synthesis, and technical precision."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "RAJARAM K" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    "httpx>=0.27",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
aetheris = "aetheris.cli:main"

[tool.setuptools.packages.find]
include = ["aetheris*"]

# Ship the spec override example as package data so it is discoverable.
[tool.setuptools.package-data]
aetheris = ["*.example.json"]
