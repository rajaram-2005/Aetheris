[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aetheris"
version = "0.3.0"
description = "Aetheris — a next-generation AI thought partner for deep reasoning, creative synthesis, and technical precision."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "RAJARAM K" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx"]

[project.scripts]
aetheris = "aetheris.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["aetheris*"]

# Ship the browser experience and spec example with wheels/sdists.
[tool.setuptools.package-data]
aetheris = ["api/*.html", "core/*.example.json"]
