# Fly.io — Aetheris One
#   fly launch --copy-config --config deploy/fly.toml --dockerfile Dockerfile --no-deploy
#   fly volumes create aetheris_data --size 10
#   fly secrets set AETHERIS_SECRET=$(openssl rand -hex 32) AETHERIS_ADMIN_EMAILS=you@example.com
#   Add GOOGLE_CLIENT_ID/SECRET and GITHUB_CLIENT_ID/SECRET with `fly secrets set`.
#   Never put those secret values in this file.
#   fly deploy
app = "aetheris"
primary_region = "sin"

[build]
  dockerfile = "../Dockerfile"

[env]
  AETHERIS_DATA_DIR = "/data"
  NODE_ENV = "production"
  NEXT_TELEMETRY_DISABLED = "1"
  AETHERIS_REQUIRE_AUTH = "1"
  AETHERIS_GUEST_ACCESS = "1"
  PORT = "3000"

[[mounts]]
  source = "aetheris_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false   # the minute scheduler needs an always-on process
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 1     # single writer: JSON stores + SQLite

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
