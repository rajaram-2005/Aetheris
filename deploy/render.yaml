# Render Blueprint — Aetheris One (Docker + persistent disk)
#   render blueprint launch      (or: New → Blueprint → point at this repo)
services:
  - type: web
    name: aetheris
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter          # needs a paid-tier instance for the disk; free tier has no persistence
    numInstances: 1        # single writer: JSON stores + SQLite
    healthCheckPath: /api/health
    autoDeploy: false
    disk:
      name: aetheris-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: AETHERIS_DATA_DIR
        value: /data
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: AETHERIS_REQUIRE_AUTH
        value: "1"
      - key: AETHERIS_GUEST_ACCESS
        value: "1"
      - key: AETHERIS_SECRET        # openssl rand -hex 32
        generateValue: true
      - key: AETHERIS_ADMIN_KEY     # openssl rand -hex 24
        generateValue: true
      - key: AETHERIS_ADMIN_EMAILS
        sync: false
      # Configure Google and GitHub in the Render dashboard (never commit these values).
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # Model-provider keys are optional (keyless providers work out of the box).
      # - key: GROQ_API_KEY
      #   sync: false
